[package]
name = "curaye-desktop"
version = "0.0.1"
description = "Curaye Desktop"
authors = ["Curaye"]
edition = "2021"

[lib]
name = "curaye_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "curaye-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
